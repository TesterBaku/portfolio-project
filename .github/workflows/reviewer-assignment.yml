name: Reviewer Assignment Policy

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  reviewer-assigned:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure at least one reviewer is requested
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const userCount = pr.requested_reviewers?.length || 0;
            const teamCount = pr.requested_teams?.length || 0;
            const total = userCount + teamCount;

            core.info(`Requested reviewers: users=${userCount}, teams=${teamCount}`);

            if (total < 1) {
              core.setFailed('At least one reviewer must be requested on every PR targeting develop/main.');
            }
