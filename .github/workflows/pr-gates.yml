name: PR Gates

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  develop-gates:
    if: ${{ github.base_ref == 'develop' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run AI assistant tests
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-assistant/requirements.txt
          pytest services/ai-assistant/tests -q

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run logistics-core unit tests
        run: mvn -f services/logistics-core/pom.xml test

  main-promotion-gates:
    if: ${{ github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run AI assistant tests
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-assistant/requirements.txt
          pytest services/ai-assistant/tests -q

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run logistics-core unit tests
        run: mvn -f services/logistics-core/pom.xml test

      - name: Optional E2E gate for main promotion
        run: |
          if [ -d tests/e2e ]; then
            echo "E2E directory found. Add your E2E runner command here."
          else
            echo "No E2E suite present yet. Skipping E2E gate."
          fi
