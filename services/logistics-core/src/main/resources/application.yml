spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logistics}
    username: ${DB_USER:logistics}
    password: ${DB_PASSWORD:logistics}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${JAVA_SERVICE_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
