services:
  postgres:
    image: postgres:16-alpine
    container_name: logistics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logistics}
      POSTGRES_USER: ${POSTGRES_USER:-logistics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logistics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logistics} -d ${POSTGRES_DB:-logistics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:10.17.0-alpine
    container_name: logistics-flyway
    command:
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-logistics}
      - -user=${POSTGRES_USER:-logistics}
      - -password=${POSTGRES_PASSWORD:-logistics}
      - -locations=filesystem:/flyway/sql
      - migrate
    volumes:
      - ./database/migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
